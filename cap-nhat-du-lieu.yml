name: Cập nhật dữ liệu thị trường

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 16:00 giờ Việt Nam, thứ Hai – thứ Sáu
  workflow_dispatch:
    inputs:
      so_ma:
        description: "Số mã cập nhật báo cáo tài chính trong lần chạy này (chạy thử: 10)"
        default: "250"

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -U vnstock pandas

      - name: Lấy dữ liệu
        run: python script/capnhat.py --so-ma "${{ github.event.inputs.so_ma || '250' }}" --phut-toi-da 300

      - name: Lưu kết quả vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git pull --rebase
            git push
          fi
